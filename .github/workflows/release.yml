name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: amo

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          MANIFEST_VERSION="$(bun -e "console.log(require('./manifest.json').version)")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json ($PACKAGE_VERSION) and manifest.json ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Build extension
        run: bun run build

      - name: Stage extension package
        run: bun run stage-extension

      - name: Sign with AMO
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL || 'listed' }}
          AMO_APPROVAL_TIMEOUT: ${{ vars.AMO_APPROVAL_TIMEOUT || '1800000' }}
          AMO_TIMEOUT: ${{ vars.AMO_TIMEOUT || '1800000' }}
        run: |
          bunx web-ext sign \
            --source-dir build/extension \
            --artifacts-dir web-ext-artifacts \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --channel "$AMO_CHANNEL" \
            --approval-timeout "$AMO_APPROVAL_TIMEOUT" \
            --timeout "$AMO_TIMEOUT"

      - name: Locate signed archive
        id: signed-archive
        run: |
          SIGNED_XPI="$(find web-ext-artifacts -maxdepth 1 -type f -name '*.xpi' | sort | tail -n 1)"
          if [ -z "$SIGNED_XPI" ]; then
            echo "Signed XPI was not found in web-ext-artifacts."
            exit 1
          fi
          echo "path=$SIGNED_XPI" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: bun scripts/release-notes.ts "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.signed-archive.outputs.path }}" \
            --title "Ununique ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
