name: Create GitHub Release from AMO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "AMO/GitHub release version, without the leading v"
        required: true
        type: string
      tag:
        description: "Git tag to release. Defaults to v<version>."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-from-amo-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-from-amo:
    runs-on: ubuntu-latest
    environment: amo

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: release-tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stop if GitHub Release already exists
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release-tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "GitHub Release ${{ steps.release-tag.outputs.tag }} already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download signed archive from AMO
        id: amo-archive
        if: steps.existing-release.outputs.exists != 'true'
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_ADDON_ID: ${{ vars.AMO_ADDON_ID }}
          AMO_BASE_URL: ${{ vars.AMO_BASE_URL }}
        run: |
          XPI_PATH="$(bun scripts/download-amo-signed.ts "${{ inputs.version }}" web-ext-artifacts | tail -n 1)"
          if [ ! -f "$XPI_PATH" ]; then
            echo "Downloaded XPI was not found: $XPI_PATH"
            exit 1
          fi
          echo "path=$XPI_PATH" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: steps.existing-release.outputs.exists != 'true'
        run: bun scripts/release-notes.ts "${{ inputs.version }}" release-notes.md

      - name: Create GitHub Release
        if: steps.existing-release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release-tag.outputs.tag }}" \
            "${{ steps.amo-archive.outputs.path }}" \
            --title "Ununique ${{ inputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
