name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: format-check
            command: bun run format-check
          - task: lint
            command: bun run lint
          - task: type-check
            command: bun run type-check
          - task: build
            command: bun run build
          - task: web-ext-lint
            command: bun run web-ext:lint

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: ${{ matrix.command }}
